project:
  type: website
  output-dir: ../docs

website:
  title: "Pristine Seas Science Database"
  site-url: https://pristine-seas.github.io/legacy-db/
  repo-url: https://github.com/pristine-seas/legacy-db
  page-navigation: true

  sidebar:
    style: floating
    search: true
    collapse-level: 2
    contents:
      - text: "Overview"
        file: index.qmd
      - text: "Database Architecture"
        file: 01_architecture.qmd
      - text: "Expeditions Dataset"
        file: 02_expeditions.qmd
      - text: "Methods Datasets"
        file: 05_methods.qmd
        contents:
        - text: "Underwater Visual Surveys (UVS)"
          file: 06_uvs.qmd
          contents:
            - text: "Fish BLT"
              file: 07_uvs_blt.qmd
            - text: "Benthos LPI"
              file: 08_uvs_lpi.qmd
            - text: "Inverts"
              file: 09_uvs_inverts.qmd
            - text: "Recruits"
              file: 10_uvs_recruits.qmd
        - text: "eDNA"
          file: 11_edna.qmd
        - text: "Seabed BRUVS"
          file: 12_sbruv.qmd
        - text: "Pelagic BRUVS"
          file: 13_pbruv.qmd
        - text: "Seabird surveys"
          file: 14_birds.qmd
        - text: "Submersible"
          file: 15_sub.qmd
        - text: "ROV"
          file: 16_rov.qmd
        - text: "Deep Sea Cameras"
          file: 17_dscm.qmd
      - text: "Taxa Info"
        file: 03_taxa_info.qmd
        contents:
          - text: "Benthos"
            file: 03_taxa_info_benthos.qmd
          - text: "Fish"
            file: 03_taxa_info_fish.qmd
            contents:
              - text: "UVS field codes"
                file: 03_taxa_info_fish_uvs_codes.qmd
          - text: "Inverts"
            file: 03_taxa_info_inverts.qmd 
          
      - text: "Lookup Tables"
        file: 04_lookup.qmd
          
  page-footer:
    center: "© 2024 National Geographic Society. All rights reserved."
    right:
      - text: "Source Code"
        href: https://github.com/pristine-seas/legacy-db

format:
  html:
    theme: cosmo
    css: assets/css/updated_ps_style.css
    toc: true
    toc-depth: 3
    toc-location: right
    code-fold: false
    code-tools: false
    highlight-style: github
    anchor-sections: true
    fig-cap-location: bottom
    link-external-icon: true
    link-external-newwindow: true
    grid:
      sidebar-width: 280px
      body-width: 1000px
      margin-width: 200px
      gutter-width: 1.5rem

execute:
  freeze: auto
  echo: true
  warning: false
  message: false